[package]
name = "bunkai_rs"
version = "0.1.0"
edition = "2024"
description = "Rule-based Japanese sentence-boundary disambiguation (a faithful, dependency-free Rust port of bunkai)"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/gembleman/bunkai_rs"
keywords = ["japanese", "nlp", "sentence", "segmentation", "boundary"]
categories = ["text-processing"]

[features]
# Enable the built-in BUNKAI_PROF stage-timing profiler (see src/core.rs).
# Off by default so builds carry zero instrumentation overhead.
prof = []

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "segment"
harness = false

[profile.release]
debug = false
lto = true
codegen-units = 1
