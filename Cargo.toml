[package]
name = "bunkai_rs"
version = "0.1.0"
edition = "2024"
description = "Rule-based Japanese sentence-boundary disambiguation (a faithful, dependency-free Rust port of bunkai)"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/megagonlabs/bunkai"
keywords = ["japanese", "nlp", "sentence", "segmentation", "boundary", "disambiguation"]
categories = ["text-processing"]

[lib]
name = "bunkai_rs"
# rlib for library users; cdylib lets `--features python` build a Python
# extension module (see src/python.rs).
crate-type = ["rlib", "cdylib"]

[dependencies]
once_cell = "1.21"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }
regex = "1.11"

[features]
default = []
# Build a CPython extension module. Set PYO3_PYTHON/`--config-settings` via
# maturin for packaging; for a quick manual build:
#   cargo build --release --features python
#   cp target/release/libbunkai_rs.so _bunkai_rs$(python3-config --extension-suffix)
python = ["dep:pyo3"]
